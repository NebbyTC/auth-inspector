name: Python CI Pipeline

# <-- Kiedy automatyzacja ma się uruchomić
on:
  push:
    branches: [ "main" ]  # <-- Uruchom przy każdym wypchnięciu kodu na gałąź main
  pull_request:
    branches: [ "main" ]  # <-- Uruchom przy próbie połączenia kodu z main

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Install systemd development libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libsystemd-dev python3-systemd

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python requirements
      run: |
        python -m pip install --upgrade pip
        pip install systemd-python

    - name: Run unit tests
      run: |
        python -m unittest test_auth_inspector_unit.py

  run-security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run security scan
      run: |
        bandit -c pyproject.toml -r . -ll

  run-integration-tests:
    runs-on: ubuntu-latest
    needs: [run-unit-tests, run-security-scan]

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
 
    - name: Install systemd development libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libsystemd-dev python3-systemd

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
 
    - name: Install Python requirements
      run: |
        python -m pip install --upgrade pip
        pip install systemd-python

    - name: Prepare Virtual Linux Environment (Mock 'who' command)
      run: |
        mkdir -p /tmp/mock_bin
        echo '#!/bin/bash' > /tmp/mock_bin/who
        echo 'echo "testuser  pts/5        2026-09-10 12:00 (192.168.99.99)"' >> /tmp/mock_bin/who
        chmod +x /tmp/mock_bin/who

    - name: Run integration tests
      run: |
        export PATH="/tmp/mock_bin:$PATH"
        python -m unittest test_auth_inspector_integration.py