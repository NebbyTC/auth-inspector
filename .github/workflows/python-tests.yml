name: Python CI Pipeline

# <-- When the automatisation should run
on:
  push:
    branches: [ "main", "*" ]
    paths-ignore:
      - '.github/workflows/**'       
      - 'test_*.py'                  
      - 'tests/**'                   
      - 'README.md'                  
      - '.gitignore'              

  pull_request:
    branches: [ "main" ]  # <-- Run on merge attempt with 'main'

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Install systemd development libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libsystemd-dev python3-systemd

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python requirements
      run: |
        python -m pip install --upgrade pip
        pip install systemd-python

    - name: Run unit tests
      run: |
        python -m unittest test_auth_inspector_unit.py

  run-security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run security scan
      run: |
        bandit -c pyproject.toml -r . -ll

  run-integration-tests:
    runs-on: ubuntu-latest
    needs: [run-unit-tests, run-security-scan]

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
 
    - name: Install systemd development libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libsystemd-dev python3-systemd

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
 
    - name: Install Python requirements
      run: |
        python -m pip install --upgrade pip
        pip install systemd-python

    - name: Prepare Virtual Linux Environment (Mock 'who' command)
      run: |
        mkdir -p /tmp/mock_bin
        echo '#!/bin/bash' > /tmp/mock_bin/who
        echo 'echo "testuser  pts/5        2026-09-10 12:00 (192.168.99.99)"' >> /tmp/mock_bin/who
        chmod +x /tmp/mock_bin/who

    - name: Run integration tests
      run: |
        export PATH="/tmp/mock_bin:$PATH"
        sudo -E python -m unittest test_auth_inspector_integration.py

  build-and-release-deb:
    runs-on: ubuntu-latest
    needs: [run-unit-tests, run-security-scan, run-integration-tests]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    env:
      TZ: 'Europe/Warsaw'

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Generate Rolling Version Number
      id: get_version
      run: |
        TIMESTAMP=$(date +'%Y%m%d')
        TIME_STAMP=$(date +'%H%M')
        VERSION="1.0.0~${TIMESTAMP}.${TIME_STAMP}"
        
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Wersja pakietu to: $VERSION"

    - name: Prepare Debian Package Structure
      run: |
        mkdir -p build/usr/bin
        mkdir -p build/DEBIAN
        mkdir -p build/lib/systemd/system
        mkdir -p build/etc/audit/plugins.d/

        cp auth_inspector.py build/usr/bin/auth-inspector
        chmod +x build/usr/bin/auth-inspector
        cp .github/pkg-config/auth-inspector.service build/lib/systemd/system/auth-inspector.service

        if [ -f .github/pkg-config/auth-inspector-syslog.conf ]; then
          cp .github/pkg-config/auth-inspector-syslog.conf build/etc/audit/plugins.d/auth-inspector-syslog.conf
        fi

        export VERSION="${{ steps.get_version.outputs.VERSION }}"
        envsubst < .github/pkg-config/control > build/DEBIAN/control

        if [ -f .github/pkg-config/templates ]; then
          cp .github/pkg-config/templates build/DEBIAN/templates
        fi

        if [ -f .github/pkg-config/config ]; then
          cp .github/pkg-config/config build/DEBIAN/config
          chmod +x build/build/DEBIAN/config || chmod +x build/DEBIAN/config
        fi

        if [ -f .github/pkg-config/postinst ]; then
          cp .github/pkg-config/postinst build/DEBIAN/postinst
          chmod +x build/DEBIAN/postinst
        fi

        if [ -f .github/pkg-config/postrm ]; then
          cp .github/pkg-config/postrm build/DEBIAN/postrm
          chmod +x build/DEBIAN/postrm
        fi

    - name: Build .deb Package
      run: |
        dpkg-deb --build build "auth-inspector_${{ steps.get_version.outputs.VERSION }}_all.deb"

    - name: Publish Rolling Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: rolling-release
        name: "Auth Inspector - Rolling Release (Latest)"
        body: |
          Automatic compilation of the newest version from the branch `main`.
          Version: `${{ steps.get_version.outputs.VERSION }}`
        prerelease: true
        files: auth-inspector_${{ steps.get_version.outputs.VERSION }}_all.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}